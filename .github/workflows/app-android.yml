
name: JARVIS ONE - IRON EDITION

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rafanetto25-web-patch-1

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Diagnosticar estrutura
        shell: bash
        run: |
          echo "=== RAIZ DO PROJETO ==="
          pwd
          ls -la

          echo "=== MANIFEST COM NUMERACAO DE LINHAS ==="
          if [ -f app/src/main/AndroidManifest.xml ]; then
            nl -ba app/src/main/AndroidManifest.xml
            echo "=== VALIDACAO XML ==="
            python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('XML VALIDO')"
          else
            echo "::error::AndroidManifest.xml nao encontrado"
            exit 1
          fi

          echo "=== ARQUIVOS GRADLE ==="
          find . -maxdepth 4 -type f \( \
            -name 'settings.gradle' -o \
            -name 'build.gradle' \
          \) -print

          echo "=== ARQUIVOS JAVA E HTML ==="
          find app/src/main -type f -print

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verificar projeto Gradle
        shell: bash
        run: |
          gradle -p "$GITHUB_WORKSPACE" projects --no-daemon

      - name: Compilar APK com diagnostico
        shell: bash
        run: |
          gradle -p "$GITHUB_WORKSPACE" :app:assembleDebug \
            --no-daemon --stacktrace --info

      - name: Validar APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK nao encontrado ou vazio"
            find . -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "=== APK GERADO ==="
          ls -lh "$APK"
          unzip -t "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-ONE-IRON-EDITION-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
