
name: JARVIS ONE - IRON EDITION

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verificar arquivos do projeto
        run: |
          echo "Verificando projeto JARVIS ONE"
          find . -maxdepth 4 -type f | sort
          if [ ! -f gradlew ]; then
            echo "::error::O projeto Android e o arquivo gradlew ainda precisam ser adicionados."
            exit 1
          fi
          chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-ONE-IRON-EDITION-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
