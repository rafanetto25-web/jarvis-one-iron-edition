- name: Compilar APK
    shell: bash
    run: |
      echo "=== DIRETORIO ATUAL ==="
      pwd
      echo "=== ARQUIVOS DA RAIZ ==="
      ls -la
      echo "=== LOCALIZAR ARQUIVOS GRADLE ==="
      find . -maxdepth 4 \( -name settings.gradle -o -name build.gradle \) -type f -print
      echo "=== COMPILAR ==="
      gradle --no-daemon -p "$GITHUB_WORKSPACE" :app:assembleDebug