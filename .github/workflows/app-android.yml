
name: JARVIS ONE - IRON EDITION

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Corrigir nomes dos arquivos
        shell: bash
        run: |
          if [ -f Build.gradle ] && [ ! -f build.gradle ]; then
            mv Build.gradle build.gradle
          fi
          if [ -f Settings.gradle ] && [ ! -f settings.gradle ]; then
            mv Settings.gradle settings.gradle
          fi
          if [ -d App ] && [ ! -d app ]; then
            mv App app
          fi
          if [ -f app/Build.gradle ] && [ ! -f app/build.gradle ]; then
            mv app/Build.gradle app/build.gradle
          fi

      - name: Conferir arquivos
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Criar Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verificar APK gerado
        shell: bash
        run: |
          echo "Procurando arquivos APK..."
          find app/build/outputs/apk -type f -name "*.apk" -print
          test -n "$(find app/build/outputs/apk -type f -name "*.apk" -print -quit)"

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-ONE-IRON-EDITION-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
