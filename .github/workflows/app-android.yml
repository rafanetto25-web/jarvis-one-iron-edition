name: JARVIS ONE - IRON EDITION

on:
workflow_dispatch:
push:
branches:
- main
- rafanetto25-web-patch-1

permissions:
contents: read

jobs:
build:
name: Compilar APK Android
runs-on: ubuntu-latest

steps:
  - name: Baixar projeto
    uses: actions/checkout@v4

  - name: Preparar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Diagnosticar estrutura
    shell: bash
    run: |
      echo "=== DIRETORIO DO PROJETO ==="
      pwd
      echo "=== ARQUIVOS DA RAIZ ==="
      ls -la

      echo "=== ARQUIVOS GRADLE ==="
      find . -maxdepth 4 -type f \( \
        -name 'settings.gradle' -o \
        -name 'settings.gradle.kts' -o \
        -name 'build.gradle' -o \
        -name 'build.gradle.kts' \
      \) -print

      echo "=== ARQUIVOS DO APP ==="
      find app/src/main -maxdepth 6 -type f -print 2>/dev/null || true

      if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
        echo "::error::settings.gradle ausente na raiz"
        exit 1
      fi

      if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
        echo "::error::build.gradle ausente na raiz"
        exit 1
      fi

      if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
        echo "::error::Configuracao Gradle do app ausente"
        exit 1
      fi

  - name: Preparar Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Verificar projeto Gradle
    shell: bash
    run: |
      gradle -p "$GITHUB_WORKSPACE" projects --no-daemon

  - name: Compilar APK
    shell: bash
    run: |
      gradle -p "$GITHUB_WORKSPACE" :app:assembleDebug --no-daemon

  - name: Validar APK
    shell: bash
    run: |
      APK="app/build/outputs/apk/debug/app-debug.apk"

      if [ ! -s "$APK" ]; then
        echo "::error::APK nao encontrado ou vazio"
        find . -type f -name "*.apk" -print || true
        exit 1
      fi

      echo "=== APK GERADO ==="
      ls -lh "$APK"
      unzip -t "$APK"

  - name: Publicar APK
    uses: actions/upload-artifact@v4
    with:
      name: JARVIS-ONE-IRON-EDITION-APK
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 7
      compression-level: 0