name: JARVIS ONE - IRON EDITION

on:
workflow_dispatch:
push:
branches:
- main
- rafanetto25-web-patch-1

permissions:
contents: read

jobs:
build:
name: Compilar APK Android
runs-on: ubuntu-latest

steps:
  - name: Baixar projeto
    uses: actions/checkout@v4
    with:
      repository: rafanetto25-web/jarvis-one-iron-edition
      ref: rafanetto25-web-patch-1

  - name: Preparar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Conferir arquivos
    shell: bash
    run: |
      pwd
      ls -la
      test -f settings.gradle
      test -f build.gradle
      test -f app/build.gradle
      test -f app/src/main/AndroidManifest.xml

  - name: Preparar Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Compilar APK
    shell: bash
    run: gradle --no-daemon :app:assembleDebug

  - name: Validar APK
    shell: bash
    run: |
      APK="app/build/outputs/apk/debug/app-debug.apk"
      if [ ! -s "$APK" ]; then
        echo "::error::APK não encontrado ou vazio"
        find . -type f -name "*.apk" -print || true
        exit 1
      fi
      ls -lh "$APK"
      unzip -t "$APK"

  - name: Publicar APK
    uses: actions/upload-artifact@v4
    with:
      name: JARVIS-ONE-IRON-EDITION-APK
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 7
      compression-level: 0