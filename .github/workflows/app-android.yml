
name: JARVIS ONE - IRON EDITION

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Diagnosticar arquivos
        shell: bash
        run: |
          echo "=== RAIZ DO REPOSITORIO ==="
          pwd
          ls -la

          echo "=== TODOS OS ARQUIVOS ==="
          find . -maxdepth 6 -type f | sort

      - name: Corrigir nomes e pastas
        shell: bash
        run: |
          if [ -f Build.gradle ] && [ ! -f build.gradle ]; then
            mv Build.gradle build.gradle
          fi

          if [ -f Settings.gradle ] && [ ! -f settings.gradle ]; then
            mv Settings.gradle settings.gradle
          fi

          if [ -d App ] && [ ! -d app ]; then
            mv App app
          fi

          if [ -f app/Build.gradle ] && [ ! -f app/build.gradle ]; then
            mv app/Build.gradle app/build.gradle
          fi

          if [ -f app/src/main/java/com/jarvisone/iron/MainActivity.java ]; then
            echo "MainActivity encontrada."
          else
            echo "::error::MainActivity.java nao encontrada no caminho esperado."
          fi

      - name: Conferir estrutura Android
        shell: bash
        run: |
          test -f settings.gradle || {
            echo "::error::settings.gradle nao encontrado na raiz."
            exit 1
          }

          test -f build.gradle || {
            echo "::error::build.gradle nao encontrado na raiz."
            exit 1
          }

          test -f app/build.gradle || {
            echo "::error::app/build.gradle nao encontrado."
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "::error::AndroidManifest.xml nao encontrado."
            exit 1
          }

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Criar Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-ONE-IRON-EDITION-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
