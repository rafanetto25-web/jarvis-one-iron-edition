name: JARVIS ONE - IRON EDITION

on:
workflow_dispatch:
push:
branches:
- main
- rafanetto25-web-patch-1

permissions:
contents: read

jobs:
build:
name: Compilar APK Android
runs-on: ubuntu-latest

steps:
  - name: Baixar projeto
    uses: actions/checkout@v4

  - name: Preparar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Conferir arquivos na raiz
    shell: bash
    run: |
      pwd
      ls -la
      test -f settings.gradle || { echo "::error::settings.gradle não encontrado"; exit 1; }
      test -f build.gradle || { echo "::error::build.gradle não encontrado"; exit 1; }
      test -f app/build.gradle || { echo "::error::app/build.gradle não encontrado"; exit 1; }
      test -f app/src/main/AndroidManifest.xml || { echo "::error::AndroidManifest.xml não encontrado"; exit 1; }

  - name: Preparar Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Compilar APK
    shell: bash
    run: gradle --no-daemon :app:assembleDebug

  - name: Conferir APK
    shell: bash
    run: |
      APK="app/build/outputs/apk/debug/app-debug.apk"
      if [ ! -s "$APK" ]; then
        echo "::error::APK não foi gerado ou está vazio."
        find . -type f -name "*.apk" -print || true
        exit 1
      fi
      ls -lh "$APK"
      unzip -t "$APK"

  - name: Publicar APK para download
    uses: actions/upload-artifact@v4
    with:
      name: JARVIS-ONE-IRON-EDITION-APK
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 7
      compression-level: 0