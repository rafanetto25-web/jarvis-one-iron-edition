
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080a12">
<title>JARVIS ONE — IRON EDITION</title>

<style>
:root {
  --red: #ff263d;
  --gold: #ffc65b;
  --blue: #67e7ff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(ellipse at center, #21101b 0%, #0b0c16 43%, #05060b 100%);
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header {
  width: 100%;
  text-align: center;
  padding: 27px 12px 0;
}

.brand {
  color: var(--gold);
  font-size: 23px;
  font-weight: 800;
  letter-spacing: 5px;
  text-shadow: 0 0 18px #ff9d3b77;
}

.subtitle {
  color: #8d9aaa;
  font-size: 9px;
  letter-spacing: 4px;
  margin-top: 9px;
}

.status {
  margin-top: 20px;
  color: var(--blue);
  font-size: 10px;
  letter-spacing: 3px;
}

main {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
}

.reactor {
  width: min(84vw, 390px, 42vh);
  width: min(84vw, 390px, 42dvh);
  aspect-ratio: 1;
  position: relative;
  display: grid;
  place-items: center;
  filter: drop-shadow(0 0 22px #ff203b20);
}

.ring {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}

.ring-one {
  inset: 1%;
  border: 1px solid #67e7ff99;
  box-shadow: 0 0 16px #35cfff22, inset 0 0 16px #35cfff17;
  animation: rotate 24s linear infinite;
}

.ring-one::before,
.ring-one::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  inset: 5%;
  border: 2px dashed #67e7ff66;
}

.ring-one::after {
  inset: -3%;
  border: 2px solid transparent;
  border-top-color: var(--blue);
  border-bottom-color: #67e7ff66;
}

.ring-two {
  inset: 10%;
  border: 3px solid transparent;
  border-left-color: var(--gold);
  border-right-color: var(--gold);
  box-shadow: 0 0 14px #ffc65b35;
  animation: rotateBack 12s linear infinite;
}

.ring-three {
  inset: 17%;
  border: 1px solid #ff526a99;
  box-shadow: 0 0 20px #ff263d33, inset 0 0 22px #ff263d22;
}

.ring-three::before {
  content: "";
  position: absolute;
  inset: 7%;
  border-radius: 50%;
  border: 5px solid transparent;
  border-top-color: var(--red);
  border-bottom-color: var(--gold);
  animation: rotate 7s linear infinite;
}

.ring-four {
  inset: 26%;
  background: radial-gradient(circle, #ff687c 0%, #ff263d 26%, #971026 54%, #230713 75%);
  box-shadow: 0 0 18px #ff263d, 0 0 42px #ff263d99, 0 0 80px #ff263d44, inset 0 0 24px #ffb0a0;
  animation: pulse 2.5s ease-in-out infinite alternate;
}

.core-glass {
  position: absolute;
  inset: 31%;
  border-radius: 50%;
  background: radial-gradient(ellipse at 35% 25%, #fff8e7 0%, #ffc65b 7%, #ff4b3c 23%, #9b102a 49%, #210916 76%);
  border: 2px solid #ffd27a;
  box-shadow: inset 0 0 22px #fff1a566, 0 0 32px #ff263d99;
  animation: pulse 1.8s ease-in-out infinite alternate;
}

.core-glass::before {
  content: "";
  position: absolute;
  width: 30%;
  height: 18%;
  left: 18%;
  top: 14%;
  border-radius: 50%;
  background: #fff8d9aa;
  filter: blur(8px);
  transform: rotate(-35deg);
}

.core-center {
  position: absolute;
  inset: 42%;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #ffd995 13%, #ff432f 38%, #7b071e 75%);
  box-shadow: 0 0 12px #fff, 0 0 35px #ff263d, 0 0 60px #ff263d99;
  animation: pulse 1.2s ease-in-out infinite alternate;
}

.speaking .ring-two { animation-duration: 3s; }
.speaking .ring-one { animation-duration: 7s; }

.speaking .ring-four,
.speaking .core-glass,
.speaking .core-center {
  animation-duration: .55s;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes rotateBack {
  to { transform: rotate(-360deg); }
}

@keyframes pulse {
  from { transform: scale(.96); }
  to { transform: scale(1.045); }
}

footer {
  width: 100%;
  padding: 0 20px max(25px, env(safe-area-inset-bottom));
  text-align: center;
}

.message {
  min-height: 40px;
  color: #d9e1ee;
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 18px;
  overflow-wrap: anywhere;
}

.command-row {
  display: flex;
  gap: 9px;
  width: 100%;
  max-width: 470px;
  margin: auto;
}

input {
  min-width: 0;
  flex: 1;
  background: #10131e;
  border: 1px solid #ffc65b77;
  border-radius: 15px;
  color: white;
  padding: 15px 13px;
  outline: none;
  font-size: 16px;
}

input:focus { border-color: var(--gold); }

button {
  border: 1px solid #ff526a99;
  border-radius: 14px;
  background: linear-gradient(145deg, #501322, #1b0d18);
  color: var(--gold);
  font-size: 19px;
  min-width: 50px;
  padding: 0 13px;
  cursor: pointer;
  touch-action: manipulation;
}

button:active { transform: scale(.95); }

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}

.mic {
  background: linear-gradient(145deg, #ff3349, #8b1027);
  color: white;
  box-shadow: 0 0 15px #ff263d44;
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}

.controls button {
  min-width: 0;
  padding: 10px 16px;
  font-size: 10px;
  letter-spacing: 1px;
}

.small {
  margin-top: 17px;
  font-size: 8px;
  letter-spacing: 2px;
  color: #586779;
}

@media (prefers-reduced-motion: reduce) {
  .ring-one,
  .ring-two,
  .ring-three::before,
  .ring-four,
  .core-glass,
  .core-center {
    animation-duration: 8s;
  }
}
</style>
</head>

<body>
<header>
  <div class="brand">J.A.R.V.I.S.</div>
  <div class="subtitle">ONE · IRON EDITION</div>
  <div class="status" id="status" aria-live="polite">● SISTEMA PRONTO</div>
</header>

<main>
  <div class="reactor" id="reactor" aria-hidden="true">
    <div class="ring ring-one"></div>
    <div class="ring ring-two"></div>
    <div class="ring ring-three"></div>
    <div class="ring ring-four"></div>
    <div class="core-glass"></div>
    <div class="core-center"></div>
  </div>
</main>

<footer>
  <div class="message" id="message" aria-live="polite">
    Olá, senhor. Estou aqui.
  </div>

  <form class="command-row" id="commandForm">
    <input
      id="command"
      type="text"
      placeholder="Fale comigo, senhor..."
      autocomplete="off"
      aria-label="Digite um comando para JARVIS"
    >
    <button type="submit" aria-label="Enviar comando">➤</button>
    <button type="button" class="mic" id="mic" aria-label="Ativar microfone">🎙</button>
  </form>

  <div class="controls">
    <button type="button" id="voice">🔊 ATIVAR VOZ</button>
    <button type="button" id="stop">■ SILENCIAR</button>
  </div>

  <div class="small">NÚCLEO DE ENERGIA · IRON EDITION</div>
</footer>

<script>
"use strict";

const statusEl = document.getElementById("status");
const messageEl = document.getElementById("message");
const reactor = document.getElementById("reactor");
const command = document.getElementById("command");
const commandForm = document.getElementById("commandForm");
const micButton = document.getElementById("mic");

let voiceEnabled = true;
let recognition = null;
let serviceRequested = false;
let recognitionActive = false;
let listeningRequested = false;

function setStatus(text) {
  statusEl.textContent = "● " + text;
}

function setMessage(text) {
  messageEl.textContent = text;
}

function speak(text) {
  setMessage(text);

  if (!voiceEnabled || !("speechSynthesis" in window)) {
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "pt-BR";
  utterance.rate = 0.91;
  utterance.pitch = 0.78;

  utterance.onstart = () => {
    reactor.classList.add("speaking");
    setStatus("JARVIS FALANDO");
  };

  utterance.onend = () => {
    reactor.classList.remove("speaking");

    if (listeningRequested || serviceRequested) {
      setStatus("ESCUTA SOLICITADA");
    } else {
      setStatus("SISTEMA PRONTO");
    }
  };

  utterance.onerror = () => {
    reactor.classList.remove("speaking");
    setStatus("SISTEMA PRONTO");
  };

  window.speechSynthesis.speak(utterance);
}

function respond(text) {
  const normalized = text.toLocaleLowerCase("pt-BR").trim();

  // Ignora completamente comandos sem o nome Jarvis.
  if (!normalized.includes("jarvis")) {
    return;
  }

  if (
    normalized.includes("como está") ||
    normalized.includes("como esta")
  ) {
    speak("Olá, senhor, estou aqui.");

  } else if (normalized.includes("seu nome")) {
    speak("Sou o JARVIS ONE, seu assistente pessoal.");

  } else if (normalized.includes("horas")) {
    const time = new Date().toLocaleTimeString("pt-BR", {
      hour: "2-digit",
      minute: "2-digit"
    });

    speak("Senhor, são " + time + ".");

  } else {
    speak("Sim, senhor. Estou ouvindo. Como posso ajudar?");
  }
}

// Ponto de entrada para a ponte Android nativa.
// A Activity ou o serviço nativo deverá chamar esta função.
window.jarvisReceiveCommand = function(text) {
  if (typeof text !== "string" || !text.trim()) {
    return;
  }

  respond(text);
};

commandForm.addEventListener("submit", event => {
  event.preventDefault();

  const text = command.value.trim();

  if (!text) {
    return;
  }

  command.value = "";
  respond(text);
});

document.getElementById("voice").addEventListener("click", () => {
  voiceEnabled = true;
  speak("Voz ativada, senhor.");
});

function stopListening() {
  listeningRequested = false;
  serviceRequested = false;

  if (recognition) {
    try {
      recognition.stop();
    } catch (error) {
      // O reconhecimento pode já estar parado.
    }
  }

  if (window.AndroidJarvis) {
    try {
      window.AndroidJarvis.stopVoiceService();
    } catch (error) {
      // A ponte nativa pode não estar disponível.
    }
  }
}

document.getElementById("stop").addEventListener("click", () => {
  voiceEnabled = false;

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  stopListening();

  if (recognition) {
    recognition = null;
  }

  recognitionActive = false;
  reactor.classList.remove("speaking");
  setStatus("SILENCIADO");
  setMessage("Voz e escuta interrompidas quando suportado.");
});

micButton.addEventListener("click", () => {
  voiceEnabled = true;

  // Se o APK fornecer uma ponte Android, solicita o serviço nativo.
  if (window.AndroidJarvis) {
    try {
      window.AndroidJarvis.startVoiceService();
      serviceRequested = true;
      listeningRequested = true;
      setStatus("ESCUTA SOLICITADA");
      setMessage("Solicitando escuta nativa, senhor.");
    } catch (error) {
      setStatus("ERRO AO INICIAR");
      setMessage("Não consegui iniciar a escuta. Verifique a permissão do microfone.");
    }

    return;
  }

  // Alternativa de reconhecimento de voz no navegador.
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    setMessage("Reconhecimento de voz indisponível. Use o campo de texto.");
    setStatus("MICROFONE INDISPONÍVEL");
    return;
  }

  if (recognitionActive && recognition) {
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "pt-BR";
  recognition.continuous = false;
  recognition.interimResults = false;
  listeningRequested = true;

  recognition.onstart = () => {
    recognitionActive = true;
    setStatus("OUVINDO");
  };

  recognition.onresult = event => {
    const result = event.results[event.results.length - 1];
    if (!result || !result[0]) return;

    const heard = result[0].transcript;
    respond(heard);
  };

  recognition.onerror = () => {
    recognitionActive = false;
    listeningRequested = false;
    setStatus("SISTEMA PRONTO");
    setMessage("Não consegui ouvir, senhor. Tente novamente.");
  };

  recognition.onend = () => {
    recognitionActive = false;

    if (!reactor.classList.contains("speaking")) {
      setStatus(
        listeningRequested ? "ESCUTA SOLICITADA" : "SISTEMA PRONTO"
      );
    }
  };

  try {
    recognition.start();
  } catch (error) {
    recognitionActive = false;
    listeningRequested = false;
    setMessage("Toque no microfone novamente para tentar.");
  }
});

setStatus("SISTEMA PRONTO");
</script>
</body>
</html>
