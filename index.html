
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08090d">
<title>JARVIS ONE — IRON EDITION</title>
<style>
:root {
  --red:#ff263d;
  --gold:#ffc65b;
  --blue:#67e7ff;
  --glow:rgba(255,38,61,.65);
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  color:#e9f7ff;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at 50% 35%,#20202b 0,#090a10 48%,#030407 100%);
  transition:background .4s;
}
body[data-mode="listening"] {
  --glow:rgba(103,231,255,.8);
  --red:#67e7ff;
}
body[data-mode="thinking"] {
  --glow:rgba(255,198,91,.8);
}
header {
  padding:22px 12px 8px;
  text-align:center;
  letter-spacing:4px;
  font-size:19px;
  font-weight:bold;
  color:var(--gold);
}
header small {
  display:block;
  color:#8a9aa9;
  font-size:10px;
  letter-spacing:4px;
  margin-top:8px;
}
.status {
  display:flex;
  justify-content:center;
  gap:9px;
  align-items:center;
  margin:22px 0;
  color:#9cecff;
  font-size:11px;
  letter-spacing:2px;
  text-align:center;
}
.dot {
  width:7px;
  height:7px;
  flex-shrink:0;
  border-radius:50%;
  background:#40ffc0;
  box-shadow:0 0 12px #40ffc0;
}
body[data-mode="listening"] .dot {
  background:var(--blue);
  box-shadow:0 0 15px var(--blue);
  animation:blink .7s infinite alternate;
}
body[data-mode="thinking"] .dot {
  background:var(--gold);
  box-shadow:0 0 15px var(--gold);
  animation:blink .5s infinite alternate;
}
.core-area {
  height: min(82vw,350px);
  min-height:275px;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
}
.core {
  width:min(70vw,260px);
  aspect-ratio:1;
  position:relative;
  display:grid;
  place-items:center;
  filter:drop-shadow(0 0 20px var(--glow));
  transition:filter .3s;
}
.ring {
  position:absolute;
  inset:0;
  border-radius:50%;
  border:2px solid transparent;
  border-top-color:var(--red);
  border-bottom-color:var(--gold);
  animation:spin 5s linear infinite;
}
.ring.r2 {
  inset:6%;
  border-width:1px;
  border-left-color:var(--blue);
  border-right-color:var(--gold);
  animation:spin 3s linear infinite reverse;
}
.ring.r3 {
  inset:13%;
  border:1px dashed #ff526b;
  animation:spin 12s linear infinite;
}
.ring.r4 {
  inset:21%;
  border:1px solid #ff263d66;
  border-left-color:var(--gold);
  border-right-color:var(--blue);
  animation:spin 2s linear infinite;
}
.scan {
  position:absolute;
  inset:0;
  border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg,transparent 275deg,#ff263d55 330deg,transparent 360deg);
  animation:spin 4s linear infinite;
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 60%,#000 62%,transparent 64%);
  mask:radial-gradient(circle,transparent 58%,#000 60%,#000 62%,transparent 64%);
}
.core-center {
  width:52%;
  aspect-ratio:1;
  border-radius:50%;
  position:relative;
  background:radial-gradient(circle,#fff4ca 0,#ffb62d 12%,#f23b30 35%,#51121e 68%,#080a10 72%);
  box-shadow:0 0 25px #ff3939,0 0 65px #ff5d2840,inset 0 0 18px #fff5bb66;
  animation:pulse 2s ease-in-out infinite;
  transition:filter .25s;
}
.core-center::after {
  content:"";
  position:absolute;
  inset:12%;
  border:1px solid #fff7d877;
  border-radius:50%;
  box-shadow:0 0 15px #ffb62d88;
}
.core::before,.core::after {
  content:"";
  position:absolute;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  height:1px;
  width:115%;
  opacity:.55;
}
.core::after { transform:rotate(90deg); }
body[data-mode="speaking"] .core {
  animation:reactive .48s ease-in-out infinite alternate;
}
body[data-mode="speaking"] .core-center {
  animation:pulse .42s ease-in-out infinite;
  filter:brightness(1.35);
}
body[data-mode="listening"] .core-center {
  animation:pulse .8s ease-in-out infinite;
}
body[data-mode="thinking"] .core-center {
  animation:pulse .55s ease-in-out infinite;
  filter:hue-rotate(18deg) brightness(1.25);
}
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes pulse {
  50% { transform:scale(1.09); filter:brightness(1.35); }
}
@keyframes reactive {
  from { transform:scale(.98); }
  to { transform:scale(1.045); }
}
@keyframes blink { to { opacity:.35; } }
.section { text-align:center; margin:0 20px; }
h1 {
  font-size:23px;
  letter-spacing:5px;
  margin:0;
  color:#fff;
}
.subtitle {
  font-size:10px;
  color:var(--blue);
  letter-spacing:3px;
  margin:10px 0 22px;
}
#reply {
  font-size:15px;
  color:#c6d9e6;
  line-height:1.6;
  min-height:48px;
  padding:0 12px;
  overflow-wrap:anywhere;
}
.controls {
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin:22px 14px;
}
button {
  border:1px solid #a33a45;
  background:linear-gradient(145deg,#24121a,#0c0d13);
  color:#fff;
  border-radius:13px;
  padding:14px 16px;
  font-size:13px;
  letter-spacing:1px;
  cursor:pointer;
}
button:active { transform:scale(.96); }
button.primary {
  background:linear-gradient(135deg,#b8182c,#4e111e);
  border-color:var(--red);
  box-shadow:0 0 20px #ff263d25;
}
input {
  width:100%;
  min-width:0;
  background:#0b1119;
  border:1px solid #334655;
  color:white;
  padding:15px;
  border-radius:10px;
  font-size:15px;
  outline:none;
}
input:focus { border-color:var(--red); }
.inputrow {
  display:flex;
  justify-content:center;
  gap:7px;
  margin:0 14px;
}
.inputrow button { padding:12px 16px; }
footer {
  text-align:center;
  font-size:9px;
  letter-spacing:2px;
  color:#71808f;
  margin:32px 0 18px;
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:4s !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>
<body data-mode="ready">
<header>
  J.A.R.V.I.S.
  <small>JUST A RATHER VERY INTELLIGENT SYSTEM</small>
</header>

<div class="status">
  <span class="dot"></span>
  <span id="status">SISTEMA INICIALIZADO</span>
</div>

<div class="core-area">
  <div class="core" aria-label="Núcleo animado do Jarvis">
    <div class="ring"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="scan"></div>
    <div class="core-center"></div>
  </div>
</div>

<section class="section">
  <h1>JARVIS ONE</h1>
  <div class="subtitle">IRON EDITION · VOZ REATIVA</div>
  <div id="reply" aria-live="polite">
    Bom dia. JARVIS ONE inicializado. Como posso ajudar?
  </div>
</section>

<div class="controls">
  <button class="primary" id="voice">🎙 ATIVAR VOZ</button>
  <button id="speak">🔊 FALAR</button>
  <button id="stop">■ SILENCIAR</button>
</div>

<div class="inputrow">
  <input id="command" placeholder="Digite um comando..." autocomplete="off">
  <button class="primary" id="send" aria-label="Enviar comando">➤</button>
</div>

<footer>JARVIS ONE · IRON EDITION · SISTEMA REATIVO</footer>

<script>
const reply = document.getElementById('reply');
const status = document.getElementById('status');
const input = document.getElementById('command');

let lastReply = 'JARVIS ONE inicializado. Como posso ajudar?';
let recognition = null;
let speaking = false;
let statusBeforeSpeech = 'SISTEMA PRONTO';

function setMode(mode, label) {
  document.body.dataset.mode = mode;
  status.textContent = label;
}

function say(text) {
  lastReply = text;
  reply.textContent = text;

  if (!('speechSynthesis' in window)) {
    setMode('ready', 'TEXTO EXIBIDO');
    return;
  }

  speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'pt-BR';
  utter.rate = 1;
  utter.pitch = 0.92;

  utter.onstart = () => {
    speaking = true;
    setMode('speaking', 'JARVIS FALANDO...');
  };

  utter.onend = () => {
    speaking = false;
    setMode('ready', 'SISTEMA PRONTO');
  };

  utter.onerror = () => {
    speaking = false;
    setMode('ready', 'SISTEMA PRONTO');
  };

  speechSynthesis.speak(utter);
}

function command(raw) {
  const c = raw.trim().toLowerCase();
  if (!c) return;

  setMode('thinking', 'PROCESSANDO COMANDO...');

  if (c.includes('hora')) {
    say('Agora são ' + new Date().toLocaleTimeString('pt-BR', {
      hour:'2-digit', minute:'2-digit'
    }));
  } else if (c.includes('data') || c.includes('dia de hoje')) {
    say('Hoje é ' + new Date().toLocaleDateString('pt-BR', {
      weekday:'long', day:'numeric', month:'long', year:'numeric'
    }));
  } else if (
    c.includes('quem é você') ||
    c.includes('quem e voce') ||
    c.includes('jarvis')
  ) {
    say('Sou o JARVIS ONE, sua interface assistente. Estou pronto para receber seus comandos.');
  } else if (c.includes('abrir youtube')) {
    say('Abrindo o YouTube no navegador.');
    window.open('https://m.youtube.com/', '_blank');
  } else if (c.includes('abrir google') || c.includes('pesquisar')) {
    say('Abrindo a pesquisa do Google.');
    window.open('https://www.google.com/', '_blank');
  } else if (
    c.includes('olá') ||
    c.includes('ola') ||
    c.includes('bom dia') ||
    c.includes('boa noite')
  ) {
    say('Saudações. Sistemas funcionando. Em que posso ajudar?');
  } else {
    say('Comando recebido: ' + raw + '. Ainda estou aprendendo novas funções. Você pode perguntar a hora, a data ou pedir para abrir o YouTube.');
  }
}

function sendCommand() {
  const value = input.value;
  input.value = '';
  command(value);
}

document.getElementById('send').addEventListener('click', sendCommand);

input.addEventListener('keydown', event => {
  if (event.key === 'Enter') sendCommand();
});

document.getElementById('speak').addEventListener('click', () => {
  say(lastReply);
});

document.getElementById('stop').addEventListener('click', () => {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  speaking = false;
  setMode('ready', 'ÁUDIO SILENCIADO');
});

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

document.getElementById('voice').addEventListener('click', () => {
  if (!SpeechRecognition) {
    say('O reconhecimento de voz não está disponível neste navegador. Tente abrir a página no Chrome e permitir o uso do microfone.');
    return;
  }

  if (recognition) {
    try { recognition.stop(); } catch (error) {}
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'pt-BR';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    statusBeforeSpeech = status.textContent;
    setMode('listening', 'OUVINDO VOCÊ...');
    reply.textContent = 'Pode falar. Estou ouvindo.';
  };

  recognition.onresult = event => {
    command(event.results[0][0].transcript);
  };

  recognition.onerror = () => {
    setMode('ready', 'VOZ INDISPONÍVEL');
    reply.textContent = 'Não consegui reconhecer a voz. Confira a permissão do microfone e tente novamente.';
  };

  recognition.onend = () => {
    if (document.body.dataset.mode === 'listening') {
      setMode('ready', 'SISTEMA PRONTO');
    }
  };

  try {
    recognition.start();
  } catch (error) {
    setMode('ready', 'TENTE NOVAMENTE');
  }
});

setMode('ready', 'SISTEMA PRONTO');
</script>
</body>
</html>
