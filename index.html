
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>JARVIS ONE</title>

<style>
:root {
  --red: #ff202b;
  --red-light: #ff5961;
  --yellow: #ffd329;
  --black: #050505;
  --panel: rgba(16, 16, 19, .92);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background:
    radial-gradient(ellipse at 50% 35%, #210607 0%, #0b0506 32%, #030303 75%);
  color: #f5f5f5;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
}

.app {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 22px 20px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255, 40, 48, .35);
  padding-bottom: 15px;
}

.brand {
  color: white;
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 4px;
}

.brand span {
  color: var(--red);
}

.version {
  color: var(--yellow);
  font-size: 10px;
  letter-spacing: 2px;
}

.system-status {
  margin-top: 20px;
  color: var(--yellow);
  font-size: 11px;
  letter-spacing: 3px;
  text-align: center;
}

.core-area {
  width: 100%;
  max-width: 360px;
  aspect-ratio: 1;
  position: relative;
  display: grid;
  place-items: center;
  margin: 10px auto 0;
}

.core {
  position: relative;
  width: 39%;
  aspect-ratio: 1;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%,
      #fff 0%,
      #ffb0b0 5%,
      #ff333b 17%,
      #b80012 38%,
      #320006 67%,
      #050505 75%);
  box-shadow:
    0 0 14px #ff202b,
    0 0 35px rgba(255, 20, 35, .85),
    0 0 75px rgba(255, 0, 20, .35),
    inset 0 0 18px #ff8a8a;
  animation: corePulse 2.5s ease-in-out infinite;
  z-index: 3;
}

.core::before {
  content: "";
  position: absolute;
  inset: 13%;
  border-radius: 50%;
  border: 2px solid rgba(255, 225, 225, .85);
  box-shadow: 0 0 13px var(--red);
}

.core::after {
  content: "";
  position: absolute;
  inset: 29%;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #ff9a9a 16%, #ff101f 53%, #7a0009 100%);
  box-shadow: 0 0 18px #ff1c29;
}

.ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid transparent;
  pointer-events: none;
}

.ring-one {
  width: 57%;
  height: 57%;
  border-top-color: var(--yellow);
  border-bottom-color: var(--yellow);
  filter: drop-shadow(0 0 5px rgba(255, 211, 41, .7));
  animation: rotateOne 5s linear infinite;
}

.ring-two {
  width: 72%;
  height: 72%;
  border-left: 2px solid var(--red);
  border-right: 2px solid var(--red);
  filter: drop-shadow(0 0 6px rgba(255, 32, 43, .75));
  animation: rotateTwo 8s linear infinite;
}

.ring-three {
  width: 88%;
  height: 88%;
  border-top: 1px dashed var(--yellow);
  border-bottom: 1px dashed rgba(255, 211, 41, .55);
  animation: rotateOne 14s linear infinite;
}

.ring-four {
  width: 98%;
  height: 98%;
  border: 1px solid rgba(255, 32, 43, .22);
  animation: rotateTwo 24s linear infinite;
}

.core-area.speaking .core {
  animation: speakingPulse .45s ease-in-out infinite alternate;
}

.core-area.speaking .ring-one {
  animation-duration: 1.5s;
}

.core-area.speaking .ring-two {
  animation-duration: 2.2s;
}

@keyframes rotateOne {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes rotateTwo {
  from { transform: rotate(360deg); }
  to { transform: rotate(0deg); }
}

@keyframes corePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

@keyframes speakingPulse {
  from {
    transform: scale(1);
    filter: brightness(1);
  }
  to {
    transform: scale(1.14);
    filter: brightness(1.6);
  }
}

.tagline {
  color: rgba(255,255,255,.6);
  font-size: 10px;
  letter-spacing: 4px;
  margin-top: -3px;
  text-align: center;
}

.panel {
  width: 100%;
  background: var(--panel);
  border: 1px solid rgba(255, 32, 43, .3);
  border-radius: 15px;
  padding: 17px;
  margin-top: 24px;
  box-shadow: 0 0 25px rgba(255, 0, 20, .06);
}

.panel-title {
  color: var(--yellow);
  font-size: 10px;
  letter-spacing: 3px;
  margin-bottom: 12px;
}

.reply {
  min-height: 48px;
  color: #f0f0f0;
  font-size: 15px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.input-row {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

input {
  width: 100%;
  min-width: 0;
  padding: 13px;
  background: #080808;
  border: 1px solid #3b2426;
  border-radius: 8px;
  color: white;
  outline: none;
  font-size: 14px;
}

input:focus {
  border-color: var(--red);
}

button {
  border: 1px solid rgba(255, 32, 43, .55);
  border-radius: 8px;
  padding: 12px 14px;
  color: white;
  background: linear-gradient(145deg, #25090c, #100506);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  transform: scale(.97);
}

button.primary {
  background: linear-gradient(135deg, #c90017, #65000a);
  border-color: #ff404b;
}

button.yellow {
  border-color: rgba(255, 211, 41, .6);
  color: var(--yellow);
}

button:disabled {
  opacity: .55;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%;
  margin-top: 14px;
}

.controls button {
  min-height: 46px;
}

.controls .wide {
  grid-column: 1 / -1;
}

.footer {
  margin-top: auto;
  padding-top: 26px;
  text-align: center;
  color: #666;
  font-size: 9px;
  letter-spacing: 2px;
}

.footer span {
  color: var(--red);
}

@media (max-height: 720px) {
  .app { padding-top: 14px; }
  .core-area { max-width: 290px; }
  .panel { margin-top: 12px; padding: 13px; }
}
</style>
</head>

<body>
<main class="app">

  <header class="header">
    <div class="brand">JARVIS <span>ONE</span></div>
    <div class="version">IRON EDITION</div>
  </header>

  <div class="system-status" id="status" aria-live="polite">
    INICIALIZANDO SISTEMA
  </div>

  <section class="core-area" id="coreArea" aria-label="Núcleo de energia">
    <div class="ring ring-four"></div>
    <div class="ring ring-three"></div>
    <div class="ring ring-two"></div>
    <div class="ring ring-one"></div>
    <div class="core"></div>
  </section>

  <div class="tagline">INTELLIGENT PERSONAL ASSISTANT</div>

  <section class="panel">
    <div class="panel-title">RESPOSTA DO SISTEMA</div>

    <div class="reply" id="reply" aria-live="polite">
      Olá, senhor. Estou aqui.
    </div>

    <div class="input-row">
      <input
        id="command"
        type="text"
        placeholder="Digite um comando..."
        autocomplete="off"
        enterkeyhint="send"
      >
      <button id="send" class="primary">ENVIAR</button>
    </div>
  </section>

  <section class="controls">
    <button id="voice" class="primary wide">
      🎙 ATIVAR VOZ
    </button>

    <button id="speak">🔊 REPETIR RESPOSTA</button>
    <button id="stop" class="yellow">■ SILENCIAR ÁUDIO</button>
  </section>

  <footer class="footer">
    JARVIS ONE <span>•</span> SISTEMA PESSOAL
  </footer>

</main>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);

  const reply = $('reply');
  const status = $('status');
  const input = $('command');
  const voiceButton = $('voice');
  const coreArea = $('coreArea');

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  let recognition = null;
  let voiceEnabled = false;
  let recognitionRunning = false;
  let speaking = false;
  let restartTimer = null;
  let speechGeneration = 0;
  let lastReply = 'Olá, senhor, estou aqui.';
  let lastCommandTime = 0;

  function setStatus(text) {
    status.textContent = text;
  }

  function updateVoiceButton() {
    voiceButton.textContent = voiceEnabled
      ? '🎙 VOZ ATIVA — TOQUE PARA PARAR'
      : '🎙 ATIVAR VOZ';
  }

  function scheduleRestart(delay = 800) {
    clearTimeout(restartTimer);

    if (!voiceEnabled || speaking || !recognition) return;

    restartTimer = setTimeout(() => {
      if (!voiceEnabled || speaking || recognitionRunning) return;

      try {
        recognition.start();
      } catch (error) {
        // Uma nova tentativa evita exigir um toque a cada fala.
        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => {
          if (voiceEnabled && !speaking && !recognitionRunning) {
            try {
              recognition.start();
            } catch (e) {
              setStatus('AGUARDANDO MICROFONE');
            }
          }
        }, 1200);
      }
    }, delay);
  }

  function say(text) {
    lastReply = text;
    reply.textContent = text;

    if (!('speechSynthesis' in window)) {
      setStatus('RESPOSTA EM TEXTO');
      return;
    }

    // Invalida qualquer fala anterior ainda pendente.
    const generation = ++speechGeneration;

    speechSynthesis.cancel();
    speaking = true;
    coreArea.classList.add('speaking');

    // Evita que o reconhecimento ouça a própria voz do JARVIS.
    if (recognition && recognitionRunning) {
      try {
        recognition.stop();
      } catch (error) {}
    }

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'pt-BR';
    utterance.rate = 0.94;
    utterance.pitch = 0.88;
    utterance.volume = 1;

    const finishSpeaking = () => {
      if (generation !== speechGeneration) return;

      speaking = false;
      coreArea.classList.remove('speaking');

      if (voiceEnabled) {
        setStatus('VOZ ATIVA — OUVINDO');
        scheduleRestart(700);
      } else {
        setStatus('SISTEMA PRONTO');
      }
    };

    utterance.onend = finishSpeaking;
    utterance.onerror = finishSpeaking;

    setStatus('JARVIS RESPONDENDO...');

    try {
      speechSynthesis.speak(utterance);
    } catch (error) {
      finishSpeaking();
    }
  }

  function command(raw) {
    const text = String(raw || '').trim();
    if (!text) return;

    const c = text.toLocaleLowerCase('pt-BR');

    // Evita processar o mesmo comando duas vezes em sequência.
    const now = Date.now();
    if (now - lastCommandTime < 700) return;
    lastCommandTime = now;

    if (c.includes('como está') || c.includes('como esta')) {
      say('Olá, senhor, estou aqui.');
    } else if (
      c.includes('quem é você') ||
      c.includes('quem e voce') ||
      c.includes('quem é o jarvis')
    ) {
      say('Sou o JARVIS ONE, seu assistente pessoal. Estou aqui, senhor.');
    } else if (c.includes('que horas') || c === 'hora' || c.includes('a hora')) {
      const time = new Date().toLocaleTimeString('pt-BR', {
        hour: '2-digit',
        minute: '2-digit'
      });
      say('Senhor, agora são ' + time + '.');
    } else if (
      c.includes('que dia') ||
      c.includes('qual a data') ||
      c.includes('data de hoje')
    ) {
      const date = new Date().toLocaleDateString('pt-BR', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
      say('Senhor, hoje é ' + date + '.');
    } else if (c.includes('abrir youtube')) {
      say('Abrindo o YouTube, senhor.');
      window.open('https://www.youtube.com/', '_blank');
    } else if (c.includes('abrir google')) {
      say('Abrindo o Google, senhor.');
      window.open('https://www.google.com/', '_blank');
    } else if (c.includes('abrir whatsapp')) {
      say('Abrindo o WhatsApp, senhor.');
      window.open('https://web.whatsapp.com/', '_blank');
    } else if (
      c.includes('olá') ||
      c.includes('ola') ||
      c.includes('bom dia') ||
      c.includes('boa tarde') ||
      c.includes('boa noite')
    ) {
      say('Olá, senhor, estou aqui.');
    } else {
      say('Entendi, senhor. Ainda não tenho uma função configurada para esse comando.');
    }
  }

  function setupRecognition() {
    if (!SpeechRecognition) {
      setStatus('RECONHECIMENTO INDISPONÍVEL');
      reply.textContent =
        'Senhor, use uma versão do Chrome compatível com reconhecimento de voz.';
      return false;
    }

    if (recognition) return true;

    recognition = new SpeechRecognition();
    recognition.lang = 'pt-BR';
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      recognitionRunning = true;
      updateVoiceButton();

      if (!speaking) {
        setStatus('VOZ ATIVA — OUVINDO');
      }
    };

    recognition.onresult = event => {
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        if (!result.isFinal) continue;

        const spoken = result[0].transcript.trim();

        // Ignora qualquer fala que não contenha "Jarvis".
        if (!/\bjarvis\b/i.test(spoken)) continue;

        const cleaned = spoken
          .replace(/\bjarvis\b[:,]?\s*/i, '')
          .trim();

        if (cleaned) {
          command(cleaned);
        } else {
          say('Olá, senhor, estou aqui.');
        }
      }
    };

    recognition.onerror = event => {
      if (
        event.error === 'not-allowed' ||
        event.error === 'service-not-allowed'
      ) {
        voiceEnabled = false;
        clearTimeout(restartTimer);
        updateVoiceButton();
        setStatus('PERMISSÃO DO MICROFONE NECESSÁRIA');
        reply.textContent =
          'Senhor, permita o microfone nas configurações do Chrome e tente novamente.';
      } else if (event.error === 'audio-capture') {
        setStatus('MICROFONE INDISPONÍVEL');
      } else if (event.error === 'network') {
        setStatus('VERIFIQUE A CONEXÃO');
      }
    };

    recognition.onend = () => {
      recognitionRunning = false;

      if (voiceEnabled && !speaking) {
        setStatus('RECONECTANDO ESCUTA...');
        scheduleRestart(800);
      }
    };

    return true;
  }

  function activateVoice() {
    if (!setupRecognition()) return;

    voiceEnabled = true;
    updateVoiceButton();
    setStatus('ATIVANDO MICROFONE...');
    scheduleRestart(100);
  }

  function deactivateVoice() {
    voiceEnabled = false;
    clearTimeout(restartTimer);
    updateVoiceButton();

    if (recognition && recognitionRunning) {
      try {
        recognition.stop();
      } catch (error) {}
    }

    if ('speechSynthesis' in window) {
      ++speechGeneration;
      speechSynthesis.cancel();
    }

    speaking = false;
    coreArea.classList.remove('speaking');
    setStatus('VOZ DESATIVADA');
  }

  voiceButton.addEventListener('click', () => {
    if (voiceEnabled) {
      deactivateVoice();
    } else {
      activateVoice();
    }
  });

  $('send').addEventListener('click', () => {
    const value = input.value.trim();
    if (!value) return;

    // Texto digitado não precisa conter "Jarvis".
    command(value);
    input.value = '';
  });

  input.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      event.preventDefault();
      $('send').click();
    }
  });

  $('speak').addEventListener('click', () => {
    say(lastReply);
  });

  $('stop').addEventListener('click', () => {
    if ('speechSynthesis' in window) {
      ++speechGeneration;
      speechSynthesis.cancel();
    }

    speaking = false;
    coreArea.classList.remove('speaking');

    if (voiceEnabled) {
      setStatus('VOZ ATIVA — OUVINDO');
      scheduleRestart(500);
    } else {
      setStatus('ÁUDIO SILENCIADO');
    }
  });

  // O navegador pode exigir o primeiro toque do usuário.
  window.addEventListener('load', () => {
    setupRecognition();

    setTimeout(() => {
      if (SpeechRecognition) {
        activateVoice();
      }
    }, 1000);
  });
})();
</script>
</body>
</html>
