
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>JARVIS ONE</title>

<style>
:root {
  --red: #ff2020;
  --red-light: #ff6565;
  --yellow: #ffd21a;
  --yellow-light: #fff1a0;
  --bg: #050607;
  --text: #e9f5ff;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at 50% 42%, #25100a 0%, #0b0807 27%, #050607 65%);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .16;
  background-image:
    linear-gradient(rgba(255,210,26,.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,210,26,.10) 1px, transparent 1px);
  background-size: 35px 35px;
  mask-image: radial-gradient(ellipse, black, transparent 78%);
}

header {
  width: 100%;
  padding: 25px 15px 0;
  text-align: center;
  position: relative;
  z-index: 2;
}

.brand {
  font-size: 27px;
  letter-spacing: 7px;
  font-weight: 800;
  color: var(--yellow-light);
  text-shadow: 0 0 16px #ffb30080;
}

.subtitle {
  margin-top: 9px;
  font-size: 10px;
  letter-spacing: 4px;
  color: #9d9280;
}

main {
  width: 100%;
  max-width: 560px;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 18px 22px;
  position: relative;
  z-index: 1;
}

.reactor-wrap {
  width: min(76vw, 320px);
  aspect-ratio: 1;
  position: relative;
  display: grid;
  place-items: center;
  margin: 12px auto 20px;
  filter: drop-shadow(0 0 13px #ff3b1730);
}

.reactor {
  position: relative;
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  animation: reactorFloat 4s ease-in-out infinite;
}

.ring {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}

.ring-outer {
  inset: 2%;
  border: 2px solid transparent;
  border-top-color: var(--yellow);
  border-bottom-color: #ffad00;
  box-shadow: 0 0 12px #ffbd0080, inset 0 0 10px #ffbd0020;
  animation: spin 12s linear infinite;
}

.ring-outer::before,
.ring-outer::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--yellow-light);
  box-shadow: 0 0 13px var(--yellow);
}

.ring-outer::before {
  top: 10%;
  left: 19%;
}

.ring-outer::after {
  bottom: 10%;
  right: 19%;
}

.ring-middle {
  inset: 9%;
  border: 1px dashed #ffcb35;
  box-shadow: 0 0 10px #ffba0020;
  animation: spinReverse 18s linear infinite;
}

.ring-inner {
  inset: 16%;
  border: 3px solid #a86c16;
  border-top-color: #fff09a;
  border-right-color: var(--yellow);
  border-bottom-color: #b96c09;
  box-shadow: 0 0 16px #ffad0060, inset 0 0 16px #ffbb0030;
  animation: spin 7s linear infinite;
}

.ring-inner::before,
.ring-inner::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 12px var(--yellow);
}

.ring-inner::before {
  top: 13%;
  right: 18%;
}

.ring-inner::after {
  bottom: 13%;
  left: 18%;
}

.core-halo {
  width: 53%;
  height: 53%;
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle,
    #ffb13b 0%,
    #ff3d18 28%,
    #b40000 52%,
    #4a0000 72%,
    transparent 100%);
  filter: blur(3px);
  box-shadow: 0 0 28px #ff2716a0, 0 0 65px #ff190050;
  animation: corePulse 2.2s ease-in-out infinite;
}

.core {
  position: relative;
  z-index: 2;
  width: 34%;
  height: 34%;
  border-radius: 50%;
  background: radial-gradient(circle at 37% 30%,
    #fff6be 0%,
    #ffb13b 12%,
    #ff311a 34%,
    #a60000 63%,
    #260000 100%);
  border: 2px solid #ffb54d;
  box-shadow:
    0 0 12px #ff3529,
    0 0 28px #ff1a1a,
    0 0 55px #ff250060,
    inset 0 0 13px #ff9a55;
  animation: corePulse 1.8s ease-in-out infinite;
}

.core::after {
  content: "";
  position: absolute;
  inset: 15%;
  border: 1px solid #ffe39a90;
  border-radius: 50%;
  animation: spin 5s linear infinite;
}

.scanner {
  position: absolute;
  z-index: 3;
  width: 65%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #ffdb4c, white, #ff3820, transparent);
  box-shadow: 0 0 12px var(--yellow);
  opacity: .7;
  animation: scan 3.5s ease-in-out infinite;
}

.orbit-dot {
  position: absolute;
  width: 8px;
  height: 8px;
  top: 50%;
  left: 50%;
  margin: -4px;
  border-radius: 50%;
  background: #fff3a0;
  box-shadow: 0 0 12px var(--yellow);
  animation: orbit 6s linear infinite;
}

.status {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 2px 0 12px;
  color: var(--yellow-light);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ffbc25;
  box-shadow: 0 0 10px #ffbc25;
}

#response {
  min-height: 44px;
  max-width: 430px;
  width: 100%;
  text-align: center;
  font-size: 15px;
  line-height: 1.6;
  color: #e4e4e4;
  margin-bottom: 15px;
  overflow-wrap: anywhere;
}

.input-area {
  display: flex;
  width: 100%;
  gap: 8px;
  max-width: 440px;
}

#commandInput {
  flex: 1;
  min-width: 0;
  padding: 14px 15px;
  border-radius: 25px;
  border: 1px solid #a57824;
  background: #101010e8;
  color: white;
  font-size: 14px;
  outline: none;
  box-shadow: 0 0 14px #ffb0000b;
}

#commandInput:focus {
  border-color: var(--yellow);
  box-shadow: 0 0 15px #ffbf3030;
}

button {
  border: 1px solid #bd8a22;
  background: linear-gradient(135deg, #2b1c08, #14100a);
  color: var(--yellow-light);
  border-radius: 24px;
  min-height: 45px;
  padding: 0 16px;
  font-size: 11px;
  letter-spacing: 1px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:active {
  transform: scale(.96);
  background: #50300a;
}

#sendBtn {
  min-width: 49px;
  padding: 0 14px;
  font-size: 19px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 9px;
  width: 100%;
  max-width: 440px;
  margin-top: 12px;
}

.controls button {
  flex: 1 1 105px;
}

#voiceBtn.active {
  color: white;
  border-color: #ff3025;
  background: #380c0c;
  box-shadow: 0 0 14px #ff201f50;
}

#muteBtn.muted {
  border-color: #777;
  color: #aaa;
}

.hint {
  margin-top: 15px;
  color: #777166;
  font-size: 10px;
  text-align: center;
  line-height: 1.7;
}

footer {
  width: 100%;
  padding: 12px;
  text-align: center;
  color: #655c4d;
  font-size: 9px;
  letter-spacing: 2px;
  position: relative;
  z-index: 2;
}

body[data-mode="listening"] .core,
body[data-mode="listening"] .core-halo {
  animation-duration: .8s;
}

body[data-mode="listening"] .ring-outer {
  animation-duration: 4s;
}

body[data-mode="thinking"] .ring-inner {
  animation-duration: 1.5s;
}

body[data-mode="speaking"] .core,
body[data-mode="speaking"] .core-halo {
  animation-duration: .45s;
}

body[data-mode="speaking"] .ring-outer {
  animation-duration: 3s;
}

body[data-mode="speaking"] .ring-inner {
  animation-duration: 2s;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes spinReverse {
  to { transform: rotate(-360deg); }
}

@keyframes corePulse {
  0%, 100% { transform: scale(.94); opacity: .85; }
  50% { transform: scale(1.07); opacity: 1; }
}

@keyframes reactorFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

@keyframes scan {
  0%, 100% { transform: translateY(-50px); opacity: 0; }
  20%, 80% { opacity: .8; }
  50% { transform: translateY(50px); opacity: .45; }
}

@keyframes orbit {
  from { transform: rotate(0deg) translateX(112px) rotate(0deg); }
  to { transform: rotate(360deg) translateX(112px) rotate(-360deg); }
}

@media (max-height: 720px) {
  header { padding-top: 15px; }
  .brand { font-size: 23px; }
  .reactor-wrap { width: min(60vw, 245px); margin: 5px auto 10px; }
  main { padding-bottom: 10px; }
  #response { margin-bottom: 8px; min-height: 30px; }
  .hint { margin-top: 9px; }
}

@media (prefers-reduced-motion: reduce) {
  .reactor, .ring, .core, .core-halo, .scanner, .orbit-dot {
    animation-duration: 8s;
  }
}
</style>
</head>

<body data-mode="idle">

<header>
  <div class="brand">JARVIS ONE</div>
  <div class="subtitle">PERSONAL AI ASSISTANT</div>
</header>

<main>
  <div class="reactor-wrap" aria-label="Núcleo de energia animado">
    <div class="reactor">
      <div class="ring ring-outer"></div>
      <div class="ring ring-middle"></div>
      <div class="ring ring-inner"></div>
      <div class="core-halo"></div>
      <div class="core"></div>
      <div class="scanner"></div>
      <div class="orbit-dot"></div>
    </div>
  </div>

  <div class="status">
    <span class="status-dot"></span>
    <span id="statusText">Aguardando, senhor</span>
  </div>

  <div id="response" aria-live="polite">
    Olá, senhor. Estou aqui.
  </div>

  <form class="input-area" id="commandForm">
    <input
      id="commandInput"
      type="text"
      placeholder="Digite um comando..."
      autocomplete="off"
      aria-label="Digite um comando para o Jarvis"
    >
    <button id="sendBtn" type="submit" aria-label="Enviar comando">➤</button>
  </form>

  <div class="controls">
    <button id="voiceBtn" type="button">🎙 ATIVAR VOZ</button>
    <button id="speakBtn" type="button">🔊 FALAR</button>
    <button id="muteBtn" type="button">🔇 SILENCIAR</button>
  </div>

  <div class="hint">
    Use o microfone e diga “Jarvis” antes do comando.<br>
    Ou digite diretamente na barra acima.
  </div>
</main>

<footer>JARVIS ONE · SYSTEM INTERFACE</footer>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const responseEl = $("response");
  const statusEl = $("statusText");
  const inputEl = $("commandInput");
  const voiceBtn = $("voiceBtn");
  const speakBtn = $("speakBtn");
  const muteBtn = $("muteBtn");

  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  let recognition = null;
  let listening = false;
  let muted = false;
  let lastResponse = "Olá, senhor, estou aqui.";
  let speaking = false;

  function setMode(mode, label) {
    document.body.dataset.mode = mode;
    statusEl.textContent = label;
  }

  function showResponse(text) {
    responseEl.textContent = text;
    lastResponse = text;
  }

  function speak(text) {
    showResponse(text);

    if (muted || !("speechSynthesis" in window)) {
      setMode("idle", "Aguardando, senhor");
      return;
    }

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "pt-BR";
    utterance.rate = 0.96;
    utterance.pitch = 0.88;
    utterance.volume = 1;

    const voices = window.speechSynthesis.getVoices();
    const ptVoice = voices.find(v =>
      v.lang && v.lang.toLowerCase().startsWith("pt-br")
    ) || voices.find(v =>
      v.lang && v.lang.toLowerCase().startsWith("pt")
    );

    if (ptVoice) utterance.voice = ptVoice;

    utterance.onstart = () => {
      speaking = true;
      setMode("speaking", "Jarvis falando");
    };

    utterance.onend = () => {
      speaking = false;
      if (!listening) setMode("idle", "Aguardando, senhor");
    };

    utterance.onerror = () => {
      speaking = false;
      if (!listening) setMode("idle", "Aguardando, senhor");
    };

    window.speechSynthesis.speak(utterance);
  }

  function answerCommand(raw, fromVoice = false) {
    const original = String(raw || "").trim();
    if (!original) return;

    const command = original.toLocaleLowerCase("pt-BR")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");

    // Na voz, o nome Jarvis é obrigatório.
    if (fromVoice && !/\bjarvis\b/i.test(command)) {
      return;
    }

    const clean = command.replace(/\bjarvis\b/gi, "")
      .replace(/[,.!?]/g, " ")
      .trim();

    if (!clean || /^(oi|ola|bom dia|boa tarde|boa noite|como esta|tudo bem|esta ai)$/.test(clean)) {
      speak("Olá, senhor, estou aqui.");
      return;
    }

    if (/\b(hora|horas|horario)\b/.test(clean)) {
      const now = new Date();
      const time = now.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit"
      });
      speak("Senhor, agora são " + time + ".");
      return;
    }

    if (/\b(data|dia de hoje|dia hoje)\b/.test(clean)) {
      const date = new Date().toLocaleDateString("pt-BR", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });
      speak("Senhor, hoje é " + date + ".");
      return;
    }

    if (/\b(quem e voce|seu nome|quem e voce mesmo)\b/.test(clean)) {
      speak("Sou o Jarvis, seu assistente pessoal.");
      return;
    }

    if (/\b(abra|abrir|abre|acessar)\b/.test(clean) && /\byoutube\b/.test(clean)) {
      speak("Abrindo o YouTube, senhor.");
      window.open("https://www.youtube.com/", "_blank", "noopener");
      return;
    }

    if (/\b(abra|abrir|abre|acessar)\b/.test(clean) && /\bgoogle\b/.test(clean)) {
      speak("Abrindo o Google, senhor.");
      window.open("https://www.google.com/", "_blank", "noopener");
      return;
    }

    if (/\b(abra|abrir|abre|acessar)\b/.test(clean) && /\bwhatsapp\b/.test(clean)) {
      speak("Abrindo o WhatsApp, senhor.");
      window.open("https://web.whatsapp.com/", "_blank", "noopener");
      return;
    }

    if (/\b(ajuda|o que voce faz|comandos)\b/.test(clean)) {
      speak("Senhor, posso informar a hora e a data, abrir alguns sites e responder aos comandos básicos. Você também pode digitar seu comando na barra.");
      return;
    }

    if (/\b(obrigado|obrigada|valeu)\b/.test(clean)) {
      speak("Sempre à disposição, senhor.");
      return;
    }

    speak("Entendi, senhor. Ainda não tenho uma ação configurada para esse comando.");
  }

  $("commandForm").addEventListener("submit", event => {
    event.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = "";
    answerCommand(text, false);
  });

  voiceBtn.addEventListener("click", () => {
    if (!SpeechRecognition) {
      speak("Senhor, o reconhecimento de voz não está disponível neste navegador. Tente abrir o JARVIS no Chrome atualizado e verifique a permissão do microfone.");
      return;
    }

    if (listening && recognition) {
      recognition.stop();
      return;
    }

    try {
      recognition = new SpeechRecognition();
      recognition.lang = "pt-BR";
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        listening = true;
        voiceBtn.classList.add("active");
        voiceBtn.textContent = "🎙 VOZ ATIVA";
        setMode("listening", "Escutando, senhor");
      };

      recognition.onresult = event => {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (!event.results[i].isFinal) continue;

          const transcript = event.results[i][0].transcript.trim();

          // Ignora completamente qualquer fala sem "Jarvis".
          if (!/\bjarvis\b/i.test(transcript)) continue;

          answerCommand(transcript, true);
        }
      };

      recognition.onerror = event => {
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          showResponse("Senhor, permita o acesso ao microfone nas configurações do Chrome.");
          setMode("idle", "Microfone sem permissão");
        } else if (event.error !== "no-speech" && event.error !== "aborted") {
          showResponse("Não consegui reconhecer a voz. Tente novamente, senhor.");
        }
      };

      recognition.onend = () => {
        listening = false;
        voiceBtn.classList.remove("active");
        voiceBtn.textContent = "🎙 ATIVAR VOZ";
        setMode("idle", "Aguardando, senhor");
      };

      recognition.start();
    } catch (error) {
      showResponse("Senhor, não foi possível iniciar o microfone. Tente novamente.");
      setMode("idle", "Aguardando, senhor");
    }
  });

  speakBtn.addEventListener("click", () => {
    if (muted) {
      muted = false;
      muteBtn.classList.remove("muted");
      muteBtn.textContent = "🔇 SILENCIAR";
    }
    speak(lastResponse || "Olá, senhor, estou aqui.");
  });

  muteBtn.addEventListener("click", () => {
    muted = !muted;
    muteBtn.classList.toggle("muted", muted);
    muteBtn.textContent = muted ? "🔇 SOM DESLIGADO" : "🔇 SILENCIAR";

    if (muted && "speechSynthesis" in window) {
      window.speechSynthesis.cancel();
      speaking = false;
      if (!listening) setMode("idle", "Áudio silenciado");
    } else {
      setMode("idle", "Aguardando, senhor");
    }
  });

  // Vozes do navegador podem carregar de forma assíncrona.
  if ("speechSynthesis" in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.getVoices();
    };
  }

  setMode("idle", "Aguardando, senhor");
})();
</script>
</body>
</html>
